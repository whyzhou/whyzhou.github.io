<!DOCTYPE html>
<html lang="en-us">
  <head>
  <meta http-equiv="content-type" content="text/html;charset=utf-8">
  <meta http-equiv="X-UA-Compatible" content="chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noodp"/>
  <meta name="author" content="Shirley Zhou">
  <meta name="description" content="Shirley Zhou, Product @ Stripe, Bolt, Uber.">
  <meta name="keywords" content="product management, personal portfolio, personal site, Shirley Zhou, Yangxue Zhou, Shirley Zhou Harvard, Yangxue Zhou Harvard, Rocketrip, Uber, Uber for Business, Bolt, bolt.com, Bolt Financial, Stripe, Stripe Link, Link by Stripe, Link.com">
    
  <link rel="canonical" href="/" />
  <title>Shirley Zhou</title>
  <meta name="title" content="Shirley Zhou">
	<!-- Caveat Brush -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&display=swap" rel="stylesheet">

  <style>
    :root {
      --text: #0b0b0b;
      --bg: #ffffff;
      --box: #efefef;
      --inner: #bdbdbd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Caveat Brush", cursive;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 60px 24px;
    }

    .layout {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 1fr 520px;
      column-gap: 80px;
      align-items: start;
    }

    /* LEFT COLUMN */
    .left {
      padding-left: 40px;
    }

    .name {
      font-size: clamp(56px, 6vw, 86px);
      line-height: 1;
      margin: 40px 0 70px 0;
      font-weight: 400;
    }

    .links {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: clamp(26px, 2.4vw, 36px);
      line-height: 1.7;
    }

    .links a {
      color: var(--text);
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
      text-underline-offset: 6px;
    }

    /* RIGHT COLUMN */
    .right {
      display: flex;
      justify-content: center;
      padding-top: 40px;
    }

    .photo {
      width: min(520px, 100%);
      aspect-ratio: 1 / 1;
      background: var(--box);
      display: grid;
      place-items: center;
    }

    .photo::after {
      content: "";
      width: 120px;
      height: 120px;
      background: var(--inner);
      border-radius: 14px;
    }

    /* MOBILE */
    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .right {
        display: none;
      }
      .left {
        padding-left: 0;
      }
      .name {
        margin: 20px 0 40px 0;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="layout">
      <section class="left">
        <h1 class="name">Shirley Zhou</h1>

        <ul class="links">
          <li><a href="https://linkedin.com/in/whyzhou" target="_blank" rel="noopener">Linkedin</a></li>
          <li><a href="https://www.instagram.com/whyzhou/" target="_blank" rel="noopener">Instagram</a></li>
          <li><a href="mailto:me@shirleyzhou.me" rel="me noopener">Email</a></li>
        </ul>
      </section>

      <aside class="right" aria-hidden="true">
        <div class="photo"><img src="/images/me/me.jpeg" alt="shirley"/></div>
      </aside>
    </div>
  </body>
</html>
